name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Validate configuration
      run: npm run docs:build

    - name: Validate plugin configuration
      run: |
        printf '# Example\n\nSee [LICENSE](../LICENSE).\n\n## Usage\n\nText.\n' > docs/README.md
        mkdir -p docs/ja
        printf '# 例\n\n[LICENSE](../../LICENSE) を参照してください。\n\n## 使い方\n\n本文。\n' > docs/ja/README.md
        cp config.plugin.js config.js
        npm run docs:build
      env:
        DOCS_REPOSITORY: pieceofcake2/example
        DOCS_BRANCH: main
        DOCS_SOURCE: ${{ github.workspace }}
