# Builds the documentation site of a plugin from its docs/ folder and deploys
# it to the plugin repository's GitHub Pages (https://pieceofcake2.github.io/<repo>/).
#
# Called from .github/workflows/docs.yml of each plugin:
#
#   jobs:
#     docs:
#       if: github.repository_owner == 'pieceofcake2'
#       uses: pieceofcake2/docs-skeleton/.github/workflows/plugin-docs.yml@main
#
# The caller grants `contents: read`, `pages: write` and `id-token: write`.
name: Plugin docs

on:
  workflow_call:
    inputs:
      skeleton-ref:
        description: Branch, tag or SHA of pieceofcake2/docs-skeleton to build with
        type: string
        default: main

jobs:
  build:
    # Never deploy from forks or from branches other than the default branch
    if: github.repository_owner == 'pieceofcake2' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: pieceofcake2/docs-skeleton
          ref: ${{ inputs.skeleton-ref }}
          path: skeleton
          persist-credentials: false

      - name: Merge docs into skeleton
        run: |
          rsync -a source/docs/ skeleton/docs/
          cp skeleton/config.plugin.js skeleton/config.js

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skeleton/package-lock.json

      # skeleton/.npmrc sets ignore-scripts=true
      - run: npm ci
        working-directory: skeleton

      - run: npm run docs:build
        working-directory: skeleton
        env:
          DOCS_REPOSITORY: ${{ github.repository }}
          DOCS_BRANCH: ${{ github.ref_name }}
          DOCS_SOURCE: ${{ github.workspace }}/source

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: skeleton/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
